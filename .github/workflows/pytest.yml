name: Python Tests


on:
  pull_request:
    branches: ["main", "penfever/working"]
  push:
    branches: ["main", "penfever/working"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Marin Iris source
        uses: actions/checkout@v4
        with:
          repository: marin-community/marin
          ref: main
          path: marin
          sparse-checkout: |
            lib/iris/src
            lib/rigging/src

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python pin 3.12

      - name: Create virtualenv
        run: uv venv --python 3.12

      - name: Install test dependencies (no accelerator extras)
        run: uv sync --group dev

      - name: Run CI-safe unit tests (tests/)
        env:
          MARIN_MAIN_ROOT: ${{ github.workspace }}/marin
          PYTHONPATH: ${{ github.workspace }}/marin/lib/rigging/src
        run: uv run --group dev pytest tests/ -q
