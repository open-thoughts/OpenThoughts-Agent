n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 48
  quiet: false
  plain_output: true
  retry:
    max_retries: 10
    exclude_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
    wait_multiplier: 2.0
    min_wait_sec: 1.0
    max_wait_sec: 90.0
environment:
  type: daytona
  force_build: true
  delete: true
  override_cpus: 2
  override_memory_mb: 4096
  override_storage_mb: 4096
  env:
    TOGETHER_API_KEY: ${TOGETHER_API_KEY}
    TOGETHERAI_API_KEY: ${TOGETHER_API_KEY}
  kwargs:
    auto_snapshot: true
verifier:
  max_timeout_sec: 14400
agents:
  - name: terminus-2
    model_name: together_ai/zai-org/GLM-5.2
    max_timeout_sec: 7200
    kwargs:
      record_terminal_session: false
      enable_episode_logging: false
      enable_pane_logging: false
      collect_rollout_details: false
      collect_engine_metrics: false
      trajectory_config:
        raw_content: true
        linear_history: true
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 16384
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      max_tokens: 16384
      enable_summarize: false
      proactive_summarization_threshold: 2048
datasets: []
tasks: []
