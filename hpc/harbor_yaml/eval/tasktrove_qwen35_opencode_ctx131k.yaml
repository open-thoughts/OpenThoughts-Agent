n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 32
  quiet: false
  plain_output: true
  retry:
    max_retries: 10
    exclude_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
    wait_multiplier: 2.0
    min_wait_sec: 1.0
    max_wait_sec: 90.0
environment:
  type: daytona
  force_build: true
  delete: true
  override_cpus: 2
  override_memory_mb: 8192
  override_storage_mb: 8192
  kwargs:
    auto_snapshot: true
verifier:
  max_timeout_sec: 14400
agents:
  - name: opencode
    model_name: vllm/override-at-runtime
    max_timeout_sec: 7200
    override_setup_timeout_sec: 600
    kwargs:
      version: "1.18.2"
      collect_rollout_details: false
      model_info:
        max_input_tokens: 131072
        max_output_tokens: 16384
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      trajectory_config:
        raw_content: false
        linear_history: true
      opencode_config:
        compaction:
          auto: false
datasets: []
tasks: []
