n_attempts: 1
timeout_multiplier: 1.0
trial_attempt_timeout_sec: 23400
trial_cleanup_grace_sec: 30
orchestrator:
  type: local
  n_concurrent_trials: 32
  quiet: false
  plain_output: true
  retry:
    max_retries: 10
    include_exceptions:
      - DaytonaRateLimitError
      - ContextManagementInfrastructureError
    exclude_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
      - TrialTimeoutError
    wait_multiplier: 2.0
    min_wait_sec: 1.0
    max_wait_sec: 90.0
environment:
  type: daytona
  force_build: true
  delete: true
  kwargs:
    auto_snapshot: true
verifier:
  override_timeout_sec: 14400
  max_timeout_sec: 14400
agents:
  - name: terminus-2
    model_name: placeholder/override-at-runtime
    override_timeout_sec: 7200
    max_timeout_sec: 7200
    kwargs:
      temperature: 0.6
      record_terminal_session: false
      enable_episode_logging: false
      enable_pane_logging: false
      collect_rollout_details: false
      collect_engine_metrics: false
      trajectory_config:
        raw_content: true
        linear_history: true
      model_info:
        max_input_tokens: 24576
        max_output_tokens: 8192
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      max_tokens: 8192
      extra_body:
        skip_special_tokens: false
        repetition_penalty: 1.1
      enable_summarize: true
      proactive_summarization_threshold: 2048
datasets: []
tasks: []
