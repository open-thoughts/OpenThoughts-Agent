n_attempts: 1
timeout_multiplier: 1.0
trial_attempt_timeout_sec: 23400
trial_cleanup_grace_sec: 30
orchestrator:
  type: local
  n_concurrent_trials: 32
  quiet: false
  plain_output: true
  retry:
    max_retries: 10
    include_exceptions:
      - DaytonaRateLimitError
      - ContextManagementInfrastructureError
    exclude_exceptions:
      - AgentTimeoutError
      - ContextLengthExceededError
      - TrialTimeoutError
    wait_multiplier: 2.0
    min_wait_sec: 1.0
    max_wait_sec: 90.0
environment:
  type: daytona
  force_build: true
  delete: true
  kwargs:
    auto_snapshot: true
verifier:
  override_timeout_sec: 14400
  max_timeout_sec: 14400
agents:
  - name: opencode
    model_name: openai/override-at-runtime
    override_timeout_sec: 7200
    max_timeout_sec: 7200
    override_setup_timeout_sec: 600
    kwargs:
      model_info:
        max_input_tokens: 114688
        max_output_tokens: 16384
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
      opencode_config: {}
datasets: []
tasks: []
